name: Deploy to GitHub Pages

on:
  # 當推送到 main 分支時觸發
  push:
    branches: [main]
  # 允許手動從 GitHub Actions 頁面執行工作流程
  workflow_dispatch:

# 設定權限
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4

      # 💡 注意：如果您使用 pnpm，請確保您的專案中使用了 pnpm-lock.yaml，
      # 並且您可能需要調整安裝步驟。
      # 以下示例使用 npm，但可以輕鬆切換。
      
      # 安裝 pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8 
          run_install: true # 自動執行 pnpm install

      # - name: Install dependencies
      #   run: pnpm install # 如果上面沒有執行，可以在這裡手動執行

      # - name: Build Astro site
      #   run: pnpm run build # 這會產生到 dist 目錄

      # ⚠️ 使用 withastro/action 這是最簡單的方式
      - name: Build and upload your site
        uses: withastro/action@v2
        with:
          # 以下是 Astro 專案的預設值，通常不需要修改
          node-version: 20 # 推薦的 Node.js 版本
          package-manager: pnpm # 讓 Action 知道使用 pnpm

  # 部署步驟
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4